<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="/stylesheets.css">
</head>
<body>
    <div class="whole container">

        <header>
            <div class="dark-glassBG">
                 
                <h1>
                    <img src="images/odin-lined.png" alt="">
                    ODIN
                </h1>

    
            </div>

            <p> Photo by <a href=""> AltumCode</a> On <a href="">Unsplash</a> </p>
        </header> 

        <main>
            <article>
                <p>This is not a real online service! You know you need something like this in your life
                    to help you realize your deepest dreams.</p>
                <p>Sign up now to get started.</p>
                
                <p>You know you want to.</p>
            </article>

            <form class="sign-up-form" action="" method="GET">
                <h2>Let's Do This!</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="user_firstName">FIRST NAME</label>
                        <input type="text" 
                        name="user_firstName" 
                        id="firstName">
                    </div>
                
                    <div class="form-group">
                        <label for="user_lastName">LAST NAME</label>
                        <input type="text" 
                        name="user_lastName" 
                        id="lastName">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="user_mail">EMAIL</label>
                        <input type="email" 
                        name="user_mail" 
                        id="mail">
                    </div>

                    <div class="form-group">
                        <label for="user_tel">PHONE NUMBER</label>
                        <input type="tel" 
                        name="user_tel" 
                        id="tel">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="user_pass">PASSWORD</label>
                        <input type="password" 
                        name="user_pass" 
                        id="password">
                    </div>
            
                    <div class="form-group">
                        <label for="user_passConfirm">CONFIRM PASSWORD</label>
                        <input type="password" 
                        name="user_passConfirm" 
                        id="password">
                    </div>
                </div>

            </form>

                <footer>
                    <button type="submit" form="sign-up">Create Account</button>
                    <p>Already have an account? <a href="#">Log in</a></p>
                </footer>
            
        </main> 

        

    </div>
</body>
</html>
