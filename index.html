<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="/stylesheets.css">
</head>
<body>
    <div class="whole container">
        <div class="header container">
            <div class="dark-glassBG">
                <h1>ODIN</h1>
            </div>
        </div>

        <div class="form container">
                <p>This is not a real online service! You know you need something like this in your life
                    to help you realize your deepest dreams. Sign up now to get started.</p>
                
                <p>You know you want to.</p>
            <form id="sign-up" action="" method="GET">
                <p>Let's Do This!</p>
                <label for="user_firstName">FIRST NAME</label>
                <input type="text" name="user_firstName" id="firstName">

                <label for="user_lastName">LAST NAME</label>
                <input type="text" name="user_lastName" id="lastName">

                <label for="user_mail">EMAIL</label>
                <input type="email" name="user_mail" id="mail">

                <label for="user_tel">PHONE NUMBER</label>
                <input type="tel" name="user_tel" id="tel">

                <label for="user_pass">PASSWORD</label>
                <input type="password" name="user_pass" id="password">

                <label for="user_passConfirm">CONFIRM PASSWORD</label>
                <input type="password" name="user_passConfirm" id="password">
            </form>

            <button type="submit" form="sign-up">Create Account</button>

            <p>Already have an account? <a href="#">Log in</a></p>

        </div>
    </div>
</body>
</html>
